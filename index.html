<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini AI Assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --app-blue: #007AFF; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F5F7; }
  .chat-scroll { -webkit-overflow-scrolling: touch; }
  .bubble-right { background: var(--app-blue); color: #fff; border-radius: 18px; border-bottom-right-radius: 4px; }
  .bubble-left { background: #E9E9EB; color: #111; border-radius: 18px; border-bottom-left-radius: 4px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #9AA0A6; display: inline-block; animation: bounce 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="flex justify-center">

<!-- License Gate Modal -->
<div id="licenseModal" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center px-4 backdrop-blur-sm">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 text-center">
    <div class="w-12 h-12 bg-[var(--app-blue)] text-white rounded-full flex items-center justify-center mx-auto text-lg font-bold">AI</div>
    <h3 class="font-bold text-gray-900 text-lg">Activate Assistant</h3>
    <p class="text-xs text-gray-500">Enter your Gumroad license key or type <code class="font-mono bg-gray-100 px-1 py-0.5 rounded">TEST-MODE</code> to preview.</p>
    <input type="text" id="licenseKeyInput" placeholder="License Key" class="w-full bg-gray-100 rounded-xl px-3 py-2 text-sm outline-none border text-center font-mono">
    <button id="saveLicenseBtn" class="w-full py-2.5 bg-[var(--app-blue)] text-white rounded-xl text-sm font-semibold">Unlock</button>
  </div>
</div>

<div class="flex flex-col h-screen w-full max-w-md bg-white shadow-xl relative">
  <!-- Top Bar -->
  <div class="flex items-center justify-between px-3 py-2.5 border-b border-gray-200 bg-white/95 sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[var(--app-blue)] flex items-center justify-center text-white font-bold text-xs">AI</div>
      <div>
        <div class="font-semibold text-[13.5px] leading-tight text-gray-900" id="displayCompanyName">Mini AI Assistant</div>
        <div class="text-[9.5px] text-emerald-600 font-semibold tracking-wide uppercase">Zero Data Stored</div>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <select id="tradeSelect" class="text-xs bg-gray-100 border border-gray-200 rounded-lg px-2 py-1 text-gray-700 outline-none">
        <option value="Home Cleaner">🧹 Cleaners</option>
        <option value="Painter">🎨 Painters</option>
        <option value="Electrician">⚡ Electricians</option>
        <option value="Mover">📦 Movers</option>
        <option value="Remodel Contractor">🔨 Remodels</option>
        <option value="Plumber">🔧 Plumbers</option>
        <option value="Landscaper">🌿 Landscaping</option>
      </select>
      <button id="settingsBtn" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 text-xs">⚙️</button>
    </div>
  </div>

  <!-- Primary 3-Mode Switcher -->
  <div class="grid grid-cols-3 p-1.5 bg-gray-100 border-b border-gray-200 gap-1 text-[11px] font-semibold">
    <button id="modeQuotesBtn" class="py-1.5 rounded-md bg-white text-[var(--app-blue)] shadow-sm text-center">📝 Invoices</button>
    <button id="modeMarketingBtn" class="py-1.5 rounded-md text-gray-600 hover:text-gray-900 text-center">📈 Social/Yelp</button>
    <button id="modeChatBtn" class="py-1.5 rounded-md text-gray-600 hover:text-gray-900 text-center">💬 Online Chat</button>
  </div>

  <!-- Local Quick-Add Bar (Only visible in Quotes mode) -->
  <div id="quickAddContainer" class="bg-white border-b border-gray-200 py-1.5 px-2 overflow-x-auto hide-scrollbar whitespace-nowrap flex gap-1.5">
    <!-- Rendered dynamically -->
  </div>

  <!-- Chat Log Stream -->
  <div id="chat" class="chat-scroll flex-1 overflow-y-auto px-3 py-4 space-y-3 bg-[#F5F5F7]">
    <div class="flex justify-start">
      <div id="welcomeMessage" class="bubble-left px-3.5 py-2.5 max-w-[85%] text-[13px] leading-snug">
        Tap a quick preset above, dictate scope into the mic, or drop a photo to generate an estimate.
      </div>
    </div>
  </div>

  <!-- Screenshot/Attachment Indicator -->
  <div id="imagePreviewContainer" class="hidden px-3 py-1.5 bg-blue-50 border-t border-blue-100 flex items-center justify-between text-xs text-blue-700">
    <span class="truncate max-w-[240px]" id="imageFileName">Attached screenshot</span>
    <button id="removeImageBtn" class="text-red-500 font-semibold hover:underline">Remove</button>
  </div>

  <!-- Interactive Input Console -->
  <div class="px-3 pb-3 pt-2 border-t border-gray-200 bg-white sticky bottom-0 z-20">
    <div class="flex items-end gap-2">
      <button id="micBtn" class="flex-shrink-0 w-9 h-9 rounded-full bg-[var(--app-blue)] text-white flex items-center justify-center shadow">🎤</button>
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      <button id="uploadBtn" class="flex-shrink-0 w-9 h-9 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center">📎</button>
      <div class="flex-1 bg-gray-100 rounded-full px-3 py-1.5 flex items-center">
        <input id="textInput" type="text" placeholder="Describe job or ask question..." class="w-full bg-transparent outline-none text-[13.5px] text-gray-900 placeholder-gray-400">
      </div>
      <button id="sendBtn" class="flex-shrink-0 w-9 h-9 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">➤</button>
    </div>
  </div>
</div>

<!-- Settings Drawer -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
    <div class="flex justify-between items-center">
      <h3 class="font-bold text-gray-900 text-sm">App Settings</h3>
      <button id="closeSettings" class="text-gray-400 text-lg">&times;</button>
    </div>
    <div>
      <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Company Name</label>
      <input type="text" id="prefCompanyName" class="w-full bg-gray-100 rounded-lg px-3 py-2 text-sm outline-none">
    </div>
    <div>
      <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">License Key</label>
      <input type="text" id="prefLicenseKey" class="w-full bg-gray-100 rounded-lg px-3 py-2 text-sm font-mono outline-none">
    </div>
    <button id="savePreferences" class="w-full py-2 bg-[var(--app-blue)] text-white rounded-xl text-xs font-semibold">Save</button>
  </div>
</div>

<script>
const tradePresets = {
  "Home Cleaner": [{desc: "Standard Clean", rate: 150}, {desc: "Deep Clean", rate: 250}, {desc: "Move-out Detail", rate: 120}],
  "Painter": [{desc: "Room Prep & Tape", rate: 85}, {desc: "Wall Coat (Per Room)", rate: 200}, {desc: "Paint Gallon", rate: 55}],
  "Electrician": [{desc: "Diagnostic Trip", rate: 95}, {desc: "Install Fixture", rate: 75}, {desc: "Outlet Circuit Run", rate: 220}],
  "Mover": [{desc: "2 Movers + Truck (1hr)", rate: 160}, {desc: "Heavy Item Handling", rate: 150}],
  "Remodel Contractor": [{desc: "Site Demolition (1hr)", rate: 80}, {desc: "Dump Debris Run", rate: 150}],
  "Plumber": [{desc: "Service Dispatch", rate: 89}, {desc: "Snake Line", rate: 140}, {desc: "Valve Replace", rate: 95}],
  "Landscaper": [{desc: "Mow, Edge, Blow", rate: 55}, {desc: "Yard Cleanup", rate: 175}, {desc: "Mulch Application", rate: 90}]
};

let currentActionType = 'quote';
let currentInvoiceState = { client_name: "Client Estimate", address: "", line_items: [] };
let selectedImageFile = null;

const chat = document.getElementById('chat');
const tradeSelect = document.getElementById('tradeSelect');
const quickAddContainer = document.getElementById('quickAddContainer');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const uploadBtn = document.getElementById('uploadBtn');
const imageInput = document.getElementById('imageInput');
const modeQuotesBtn = document.getElementById('modeQuotesBtn');
const modeMarketingBtn = document.getElementById('modeMarketingBtn');
const modeChatBtn = document.getElementById('modeChatBtn');
const welcomeMessage = document.getElementById('welcomeMessage');

function init() {
  const license = localStorage.getItem('mini_ai_license');
  if (!license) document.getElementById('licenseModal').classList.remove('hidden');
  document.getElementById('displayCompanyName').textContent = localStorage.getItem('mini_ai_company') || 'Mini AI Assistant';
  const savedTrade = localStorage.getItem('mini_ai_trade');
  if (savedTrade) tradeSelect.value = savedTrade;
  renderQuickAdds();
}

document.getElementById('saveLicenseBtn').addEventListener('click', () => {
  const key = document.getElementById('licenseKeyInput').value.trim();
  if (key) {
    localStorage.setItem('mini_ai_license', key);
    document.getElementById('licenseModal').classList.add('hidden');
  }
});

function setMode(mode) {
  currentActionType = mode;
  [modeQuotesBtn, modeMarketingBtn, modeChatBtn].forEach(b => {
    b.className = "py-1.5 rounded-md text-gray-600 hover:text-gray-900 text-center";
  });

  if (mode === 'quote') {
    modeQuotesBtn.className = "py-1.5 rounded-md bg-white text-[var(--app-blue)] shadow-sm text-center";
    quickAddContainer.classList.remove('hidden');
    textInput.placeholder = "Describe job or upload quote notes...";
    welcomeMessage.textContent = "Invoice Mode: Use trade presets, mic input, or uploaded notes to build an estimate.";
  } else if (mode === 'marketing') {
    modeMarketingBtn.className = "py-1.5 rounded-md bg-white text-[var(--app-blue)] shadow-sm text-center";
    quickAddContainer.classList.add('hidden');
    textInput.placeholder = "Upload screenshot of Yelp profile or template...";
    welcomeMessage.textContent = "Marketing Mode: Upload Yelp reviews, social feeds, or templates to generate post copy.";
  } else if (mode === 'chat') {
    modeChatBtn.className = "py-1.5 rounded-md bg-white text-[var(--app-blue)] shadow-sm text-center";
    quickAddContainer.classList.add('hidden');
    textInput.placeholder = "Ask any code, material pricing, or trade question...";
    welcomeMessage.textContent = "Chat Mode: Live web search is active. Ask questions about building codes, techniques, or pricing.";
  }
}

modeQuotesBtn.addEventListener('click', () => setMode('quote'));
modeMarketingBtn.addEventListener('click', () => setMode('marketing'));
modeChatBtn.addEventListener('click', () => setMode('chat'));

function renderQuickAdds() {
  quickAddContainer.innerHTML = '';
  const presets = tradePresets[tradeSelect.value] || [];
  presets.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'px-2.5 py-1 bg-gray-100 border border-gray-200 text-gray-700 rounded-full text-xs font-medium hover:bg-gray-200 flex-shrink-0';
    btn.textContent = `+ ${item.desc} ($${item.rate})`;
    btn.onclick = () => {
      addUserBubble(`Added: ${item.desc}`, false);
      currentInvoiceState.line_items.push({ description: item.desc, quantity: 1, rate: item.rate });
      renderInvoiceCard(currentInvoiceState);
    };
    quickAddContainer.appendChild(btn);
  });
}
tradeSelect.addEventListener('change', () => {
  localStorage.setItem('mini_ai_trade', tradeSelect.value);
  renderQuickAdds();
});

function renderInvoiceCard(invoice) {
  currentInvoiceState = invoice;
  const items = invoice.line_items || [];
  const subtotal = items.reduce((sum, li) => sum + (li.quantity * li.rate), 0);
  const rows = items.map(li => `
    <div class="flex justify-between py-1.5 text-xs border-b border-gray-100">
      <span class="text-gray-800">${li.quantity}x ${escapeHtml(li.description)}</span>
      <span class="font-semibold text-gray-900">$${(li.quantity * li.rate).toFixed(2)}</span>
    </div>`).join('');

  const cardId = 'card-' + Date.now();
  const company = localStorage.getItem('mini_ai_company') || 'Estimate';

  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start w-full';
  wrap.innerHTML = `
    <div class="bubble-left p-1 max-w-[94%] w-full">
      <div id="${cardId}" class="p-3 bg-white rounded-xl">
        <div class="pb-1.5 border-b border-gray-100">
          <div class="text-[9.5px] font-bold text-[var(--app-blue)] uppercase tracking-wider">${escapeHtml(company)}</div>
          <div class="text-sm font-bold text-gray-900">${escapeHtml(invoice.client_name)}</div>
        </div>
        <div class="my-2">${rows || '<div class="text-xs text-gray-400 py-1">No items yet</div>'}</div>
        <div class="flex justify-between items-center pt-2 border-t border-gray-200 bg-gray-50 px-2 py-1.5 rounded-lg">
          <span class="text-xs font-semibold text-gray-700">Total</span>
          <span class="text-sm font-bold text-[var(--app-blue)]">$${subtotal.toFixed(2)}</span>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-1 mt-1.5">
        <button onclick="html2pdf().from(document.getElementById('${cardId}')).save('Quote.pdf')" class="py-1 bg-gray-900 text-white rounded text-[11px] font-semibold">PDF</button>
        <button onclick="window.open('sms:?body=Your estimate total is $${subtotal.toFixed(2)}.')" class="py-1 bg-emerald-600 text-white rounded text-[11px] font-semibold">Text</button>
        <button onclick="currentInvoiceState={client_name:'Client Estimate',address:'',line_items:[]}; addUserBubble('Cleared quote items.', false);" class="py-1 bg-red-100 text-red-600 rounded text-[11px] font-semibold">Reset</button>
      </div>
    </div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function renderMarketingCard(intel) {
  const findings = (intel.audit_findings || []).map(f => `<li class="mb-1">${escapeHtml(f)}</li>`).join('');
  const posts = (intel.social_templates || []).map((p, idx) => `
    <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200 text-xs mb-2">
      <div class="flex justify-between font-bold text-gray-700 text-[10px] uppercase">
        <span>${escapeHtml(p.platform)}</span>
        <button onclick="copyPost('post-${idx}')" class="text-[var(--app-blue)] hover:underline">Copy Post</button>
      </div>
      <div class="font-semibold text-gray-900 mt-1">${escapeHtml(p.hook)}</div>
      <div id="post-${idx}" class="text-gray-700 mt-1 whitespace-pre-line text-[11.5px]">${escapeHtml(p.caption)}</div>
      <div class="text-[10px] text-gray-400 mt-1.5 italic">Recommended layout: ${escapeHtml(p.suggested_visual)}</div>
    </div>`).join('');

  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start w-full';
  wrap.innerHTML = `
    <div class="bubble-left p-1 max-w-[94%] w-full">
      <div class="p-3 bg-white rounded-xl">
        <div class="pb-1.5 border-b border-gray-100">
          <div class="text-[9.5px] font-bold text-purple-600 uppercase tracking-wider">Marketing Intelligence</div>
          <div class="text-sm font-bold text-gray-900">${escapeHtml(intel.business_name || 'Business Review')}</div>
        </div>
        ${findings ? `<div class="mt-2 mb-2 p-2 bg-purple-50 rounded-lg text-purple-900 text-xs"><ul class="list-disc pl-3 text-[11.5px]">${findings}</ul></div>` : ''}
        <div class="mt-2">${posts}</div>
      </div>
    </div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function renderChatReply(replyText) {
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start';
  wrap.innerHTML = `<div class="bubble-left px-3.5 py-2.5 max-w-[85%] text-xs whitespace-pre-line leading-relaxed">${escapeHtml(replyText)}</div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

window.copyPost = (id) => {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard.'));
};

async function submitToGemini(textPayload) {
  addUserBubble(textPayload || 'Analyzing uploaded file...', !!selectedImageFile);

  const formData = new FormData();
  if (selectedImageFile) formData.append('image', selectedImageFile, selectedImageFile.name);
  if (textPayload) formData.append('text', textPayload);
  formData.append('trade', tradeSelect.value);
  formData.append('actionType', currentActionType);

  selectedImageFile = null;
  document.getElementById('imagePreviewContainer').classList.add('hidden');

  const typing = document.createElement('div');
  typing.innerHTML = `<div class="bubble-left px-3.5 py-2.5 flex gap-1"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch('/api/generate-quote', {
      method: 'POST',
      headers: { 'x-license-key': localStorage.getItem('mini_ai_license') || '' },
      body: formData
    });
    typing.remove();
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server processing error');

    if (data.type === 'chat') {
      renderChatReply(data.reply);
    } else if (data.type === 'marketing') {
      renderMarketingCard(data);
    } else {
      currentInvoiceState.client_name = data.client_name || currentInvoiceState.client_name;
      currentInvoiceState.line_items = [...currentInvoiceState.line_items, ...(data.line_items || [])];
      renderInvoiceCard(currentInvoiceState);
    }
  } catch (err) {
    typing.remove();
    addUserBubble(`Notice: ${err.message}`, false);
  }
}

function addUserBubble(label, hasImg) {
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-end';
  wrap.innerHTML = `<div class="bubble-right px-3.5 py-2 max-w-[85%] text-xs">${hasImg ? '📷 ' : ''}${escapeHtml(label)}</div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

sendBtn.addEventListener('click', () => {
  if (textInput.value.trim() || selectedImageFile) {
    submitToGemini(textInput.value.trim());
    textInput.value = '';
  }
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (textInput.value.trim() || selectedImageFile)) {
    submitToGemini(textInput.value.trim());
    textInput.value = '';
  }
});

uploadBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) {
    selectedImageFile = e.target.files[0];
    document.getElementById('imageFileName').textContent = selectedImageFile.name;
    document.getElementById('imagePreviewContainer').classList.remove('hidden');
  }
});
document.getElementById('removeImageBtn').addEventListener('click', () => {
  selectedImageFile = null;
  imageInput.value = '';
  document.getElementById('imagePreviewContainer').classList.add('hidden');
});

// Settings Modal Management
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('prefCompanyName').value = localStorage.getItem('mini_ai_company') || '';
  document.getElementById('prefLicenseKey').value = localStorage.getItem('mini_ai_license') || '';
  document.getElementById('settingsModal').classList.remove('hidden');
});
document.getElementById('closeSettings').addEventListener('click', () => document.getElementById('settingsModal').classList.add('hidden'));
document.getElementById('savePreferences').addEventListener('click', () => {
  localStorage.setItem('mini_ai_company', document.getElementById('prefCompanyName').value.trim() || 'Mini AI Assistant');
  localStorage.setItem('mini_ai_license', document.getElementById('prefLicenseKey').value.trim());
  document.getElementById('displayCompanyName').textContent = localStorage.getItem('mini_ai_company');
  document.getElementById('settingsModal').classList.add('hidden');
});

init();
</script>
</body>
</html>
